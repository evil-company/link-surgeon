[package]
name = "link-surgeon"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "link_surgeon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8.1"
tauri-plugin-log = "2"
log = "0.4"
windows = { version = "0.62.2", features = ["Win32_Graphics_Dwm", "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
ts-rs = "12.0.1"
const_format = "0.2.36"
json-patch = "4.2.0"
clipboard-rs = "0.3.5"
url = "2.5.8"
regex = "1.13.1"
clear-urls = { version = "1.0.0", features = ["fetch", "rustls"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
